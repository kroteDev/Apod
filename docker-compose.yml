services:
  web:
    build: .
    container_name: apod_web
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      PORT: "${APP_INTERNAL_PORT}"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
